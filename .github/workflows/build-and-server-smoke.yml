name: Build and dedicated server smoke test

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build mod jar
        run: ./gradlew build --no-daemon

      - name: Verify mixin config is packaged
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -F 'realistic_block_physics_fixer.mixins.json'
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -F 'MixinConfigs: realistic_block_physics_fixer.mixins.json'

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-block-physics-fixer-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Dedicated server boot smoke test
        run: |
          set -euo pipefail
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          : > server-smoke.log

          setsid ./gradlew runServer --no-daemon -Dmixin.debug.verbose=true > server-smoke.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill -TERM -- "-$SERVER_PID" 2>/dev/null || true
              sleep 5
              kill -KILL -- "-$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          BOOTED=0
          for _ in $(seq 1 300); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              wait "$SERVER_PID"
              exit $?
            fi

            if grep -F 'realistic_block_physics_fixer loaded for Forge 1.20.1' server-smoke.log \
                && grep -E 'Done \([0-9.]+s\)! For help, type "help"' server-smoke.log; then
              BOOTED=1
              break
            fi

            if grep -Ei 'Crash report|Encountered an unexpected exception|Failed to start the minecraft server|Failed to start the server|Mod loading has failed' server-smoke.log; then
              cat server-smoke.log
              exit 1
            fi

            sleep 1
          done

          if [ "$BOOTED" -ne 1 ]; then
            echo 'Server did not reach the RBPF startup + Minecraft Done markers within 300 seconds.'
            cat server-smoke.log
            exit 1
          fi

          ! grep -Ei 'Crash report|Encountered an unexpected exception|Failed to start the minecraft server|Failed to start the server|Mod loading has failed' server-smoke.log

      - name: Upload server smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-server-smoke-log
          path: server-smoke.log
          if-no-files-found: ignore
